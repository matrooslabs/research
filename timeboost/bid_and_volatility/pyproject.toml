[project]
name = "bid-and-volatility"
version = "0.1.0"
description = ""
authors = [
    {name = "kosunghun317",email = "kosunghun317@kaist.ac.kr"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars (>=1.33.1,<2.0.0)",
    "ruff (>=0.13.1,<0.14.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "scipy (>=1.16.2,<2.0.0)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "statsmodels (>=0.14.5,<0.15.0)"
]

[tool.poetry]
packages = [{include = "bid_and_volatility", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
